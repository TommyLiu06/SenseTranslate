name: Validate extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint:firefox
      - run: npm run browser:install
      - run: npm run test:browser
      - run: node scripts/package.mjs --skip-crx
      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: artifacts/*
          if-no-files-found: error
